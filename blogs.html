<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Blog Posts</title>
<style>
  body {
    font-family: 'Courier New', monospace;
    background: #000;
    color: #ccc;
    margin: 0;
    padding: 20px;
    padding-top: 60px;
  }
  h1 {
    text-align: center;
    color: #DC143C;
    margin-bottom: 30px;
    margin-top: 10px;
  }
  .back-btn {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: transparent;
    color: #DC143C;
    border: 1px solid #4a0000;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    transition: all 0.3s ease;
    z-index: 1000;
  }
  .back-btn:hover {
    background: #4a0000;
    color: #FF1493;
    border-color: #DC143C;
  }
  .post-card {
    background: #1a1a1a;
    border: 1px solid #4a0000;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 15px;
    box-shadow: 0 2px 10px rgba(139,0,0,0.3);
  }
  details {
    margin-bottom: 10px;
  }
  summary {
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    color: #DC143C;
  }
  summary:hover {
    color: #FF1493;
  }
  .post-content {
    margin-top: 10px;
    color: #ccc;
    line-height: 1.6;
  }
  .post-meta {
    margin-top: 8px;
    font-size: 13px;
    color: #888;
  }
  .action-buttons {
    display: flex;
    gap: 10px;
    margin-top: 10px;
  }
  .like-btn, .comment-btn {
    background: transparent;
    border: 1px solid #4a0000;
    color: #DC143C;
    padding: 8px 16px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 20px;
    transition: all 0.3s ease;
  }
  .like-btn:hover, .comment-btn:hover {
    background: #4a0000;
    transform: scale(1.1);
  }
  /* Floating comment panel */
  .comment-panel {
    position: fixed;
    bottom: 20px;
    right: 20px;
    width: 320px;
    max-height: 400px;
    background: #1a1a1a;
    border: 1px solid #4a0000;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(139,0,0,0.5);
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .comment-header {
    background: #8B0000;
    color: white;
    padding: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .comment-body {
    flex: 1;
    overflow-y: auto;
    padding: 10px;
  }
  .comment-body p {
    background: #2a2a2a;
    border-left: 3px solid #DC143C;
    padding: 8px;
    border-radius: 5px;
    margin-bottom: 8px;
    font-size: 14px;
  }
  .comment-input {
    padding: 10px;
    border-top: 1px solid #4a0000;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .comment-input input, .comment-input textarea {
    width: 100%;
    padding: 8px;
    font-size: 14px;
    background: #2a2a2a;
    border: 1px solid #4a0000;
    border-radius: 4px;
    color: #ccc;
  }
  .comment-input button {
    background: #8B0000;
    color: white;
    border: none;
    padding: 8px;
    border-radius: 4px;
    cursor: pointer;
  }
  .comment-input button:hover {
    background: #DC143C;
  }
</style>
</head>
<body>

<button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

<h1>Blog Posts</h1>
<div id="posts-container"></div>

<!-- Floating Comment Panel -->
<div class="comment-panel" id="commentPanel">
  <div class="comment-header">
    <span id="commentPostTitle">Comments</span>
    <button onclick="closeComments()" style="background:none;border:none;color:white;font-size:18px;cursor:pointer;">✖</button>
  </div>
  <div class="comment-body" id="commentList"></div>
  <div class="comment-input">
    <input type="text" id="commentName" placeholder="Your name (optional)">
    <textarea id="commentText" rows="2" placeholder="Write a comment..."></textarea>
    <button onclick="sendComment()">Send</button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, set, get, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCR-bzkLJX31D-Qwg7vJ9aG-XxA8S56hC4",
  authDomain: "myposts-53cd9.firebaseapp.com",
  databaseURL: "https://myposts-53cd9-default-rtdb.asia-southeast1.firebasedatabase.app/",
  projectId: "myposts-53cd9",
  storageBucket: "myposts-53cd9.appspot.com",
  messagingSenderId: "347136094246",
  appId: "1:347136094246:web:2a8305ac847ce249e3f6e7"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const postsContainer = document.getElementById("posts-container");
let likedPosts = JSON.parse(localStorage.getItem("likedPosts") || "[]");

// Render posts
const postsRef = ref(db, "posts");
onValue(postsRef, snapshot => {
  const posts = snapshot.val();
  if (!posts) return postsContainer.innerHTML = "<p>No posts yet.</p>";

  const postsArray = Object.entries(posts)
    .map(([id, post]) => ({ id, ...post }))
    .sort((a, b) => b.timestamp - a.timestamp);

  postsContainer.innerHTML = postsArray.map(post => {
    const liked = likedPosts.includes(post.id);
    return `
      <div class="post-card">
        <details>
          <summary>${post.title}</summary>
          <div class="post-content">${post.content}</div>
        </details>
        <div class="post-meta">${new Date(post.timestamp).toLocaleString()}</div>
        <div class="action-buttons">
          <button class="like-btn" data-id="${post.id}">
            ${liked ? '❤️' : '🖤'} <span>${post.likes || 0}</span>
          </button>
          <button class="comment-btn" data-id="${post.id}" data-title="${post.title}">
            💬 <span class="comment-count-${post.id}">0</span>
          </button>
        </div>
      </div>
    `;
  }).join('');

  // Like buttons
  document.querySelectorAll(".like-btn").forEach(btn => {
    btn.addEventListener("click", () => toggleLike(btn));
  });

  // Comment buttons
  document.querySelectorAll(".comment-btn").forEach(btn => {
    btn.addEventListener("click", () => openComments(btn.dataset.id, btn.dataset.title));
  });

  // Update comment counts
  postsArray.forEach(post => {
    const commentsRef = ref(db, `comments/${post.id}`);
    onValue(commentsRef, snap => {
      const comments = snap.val();
      const count = comments ? Object.keys(comments).length : 0;
      const countSpan = document.querySelector(`.comment-count-${post.id}`);
      if(countSpan) countSpan.textContent = count;
    });
  });
});

// Like system
async function toggleLike(btn) {
  const postId = btn.dataset.id;
  const span = btn.querySelector("span");
  let count = parseInt(span.textContent);
  const liked = likedPosts.includes(postId);

  // Instant toggle
  if (liked) {
    btn.innerHTML = `🖤 <span>${Math.max(0, count - 1)}</span>`;
    likedPosts = likedPosts.filter(id => id !== postId);
  } else {
    btn.innerHTML = `❤️ <span>${count + 1}</span>`;
    likedPosts.push(postId);
  }
  localStorage.setItem("likedPosts", JSON.stringify(likedPosts));

  // Update Firebase quietly
  const likeRef = ref(db, `posts/${postId}/likes`);
  const snap = await get(likeRef);
  const val = snap.exists() ? snap.val() : 0;
  await set(likeRef, liked ? Math.max(0, val - 1) : val + 1);
}

// Comments
let currentPostId = null;

window.openComments = function(postId, postTitle) {
  currentPostId = postId;
  document.getElementById('commentPostTitle').textContent = postTitle;
  document.getElementById('commentPanel').style.display = 'flex';
  loadComments(postId);
};

window.closeComments = function() {
  document.getElementById('commentPanel').style.display = 'none';
  document.getElementById('commentList').innerHTML = '';
};

function loadComments(postId) {
  const commentsRef = ref(db, `comments/${postId}`);
  onValue(commentsRef, snapshot => {
    const comments = snapshot.val();
    const commentList = document.getElementById('commentList');
    commentList.innerHTML = comments
      ? Object.values(comments).map(c => `<p><b>${c.name || 'Anonymous'}:</b> ${c.text}</p>`).join('')
      : '<p style="color:#888;">No comments yet.</p>';
  });
}

window.sendComment = function() {
  const name = document.getElementById('commentName').value.trim();
  const text = document.getElementById('commentText').value.trim();
  if(!text) return alert("Comment cannot be empty!");
  const commentsRef = ref(db, `comments/${currentPostId}`);
  const newCommentRef = push(commentsRef);
  set(newCommentRef, { name: name || null, text, timestamp: Date.now() });
  document.getElementById('commentText').value = '';
};
</script>
</body>
</html>
